name: E2E Tests

# Slice policy (separate jobs so the Actions UI shows smoke / sanity / regression):
#   pull_request     → smoke
#   push             → sanity
#   workflow_dispatch → regression (full suite, on demand)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright — smoke (@smoke)
        run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  sanity:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright — sanity (@sanity)
        run: npm run test:sanity

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-sanity-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright — regression (full suite)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-regression-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  self-heal:
    needs:
      - smoke
      - sanity
      - regression
    if: ${{ always() && (needs.smoke.result == 'failure' || needs.sanity.result == 'failure' || needs.regression.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: CI self-heal after failed E2E
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_JOB=""
          SLICE_CMD=""
          if [ "${{ needs.smoke.result }}" = "failure" ]; then
            FAILED_JOB="smoke"
            SLICE_CMD="npm run test:smoke"
          elif [ "${{ needs.sanity.result }}" = "failure" ]; then
            FAILED_JOB="sanity"
            SLICE_CMD="npm run test:sanity"
          elif [ "${{ needs.regression.result }}" = "failure" ]; then
            FAILED_JOB="regression"
            SLICE_CMD="npx playwright test"
          fi
          agent -p --force --trust --output-format text "$(cat <<EOF
          Follow .cursor/rules/qa-orchestration.mdc and .cursor/skills/self-heal/SKILL.md.

          No Jira backlog — this job is CI self-heal only (push/PR E2E failure).

          The ${FAILED_JOB} job in this E2E workflow run failed.
          Event: ${{ github.event_name }} — re-run the same slice that failed before healing: ${SLICE_CMD}
          Actions run (failed E2E + this self-heal job): $RUN_URL

          Download the playwright-report artifact from this run when useful. Triage before healing.

          Respect playwright.config.ts retries (CI: 2, never above 2). Do not set workers: 1 to green a run.
          Never merge. Never weaken assertions. Never heal real app bugs (including axe WCAG). Never use .disableRules().

          On red: triage each failure.
          - Drift (POM locator) → self-heal: Agent-Browser a11y rediscovery, patch pages/ only, re-run with assertions unchanged, open one repair PR per heal. Link $RUN_URL in the PR body; record evidence under test-results/self-heal/<slug>/ per self-heal skill.
          - Real app bug → bug-reporter (human gate before filing). Stop heal path.
          - Wrong assertion or non-drift test issue → propose a minimal tests/ fix in a PR; do not call it self-heal.
          - Env/credentials → stop; document in the PR body or a job summary comment.

          Heal budget: at most 5 heals this run. Escalate if green cannot be proved without assertion changes.

          Use ATLASSIAN_EMAIL with ATLASSIAN_API_TOKEN for Jira. Use GITHUB_TOKEN for git and pull requests.
          EOF
          )"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-self-heal
          path: playwright-report/
          retention-days: 7

  eval-report:
    needs:
      - smoke
      - sanity
      - regression
      - self-heal
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate eval-report.md
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_CI_RUNS: 15
        run: node scripts/eval-report.mjs --trigger e2e --run-id ${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
          retention-days: 30
