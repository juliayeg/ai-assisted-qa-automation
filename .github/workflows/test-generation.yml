name: Test generation

on:
  schedule:
    # 06:00 UTC, Monday–Friday
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: QA agent (backlog + CI self-heal)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          agent -p --force --trust --output-format text "$(cat <<EOF
          This workflow is the external trigger. Follow .cursor/rules/qa-orchestration.mdc and .cursor/skills/self-heal/SKILL.md.
          Actions run for this job: $RUN_URL

          Respect playwright.config.ts: local retries 0, CI retries 2 (never above 2); do not set workers: 1 to green a run.
          Never merge a pull request. Never close or transition a Jira ticket. A human approves every merge and every filed bug.
          Never weaken or delete assertions. Never use .disableRules() for a11y.

          Use ATLASSIAN_EMAIL with ATLASSIAN_API_TOKEN for Jira (backlog + bug-reporter only). Use GITHUB_TOKEN for git and pull requests.

          ## Execution order (mandatory — do not end the run early)
          1. Query Jira for the backlog queue below. An empty queue (zero tickets) is normal — not a reason to stop.
          2. Backlog: only if step 1 returned one or more tickets (max 5). If zero tickets, skip section Backlog entirely.
          3. CI self-heal: ALWAYS run section CI self-heal on every workflow invocation — with or without Jira tickets, after step 2 or immediately when the queue was empty.
          Do not mark the job done until step 3 is complete (suite run + triage; repair PRs when drift heals apply).

          ## Backlog
          Queue: DS tickets in status "In Progress" that do not already have the tests-generated label.
          Budget: at most 5 tickets. Process them in key order.

          Per ticket:
          1. Analyze the ticket, including live UI recon when DIDAXIS_EMAIL and DIDAXIS_PASSWORD are set.
          2. Write a conforming Playwright spec under tests/. Page objects and fixtures only under pages/ and fixtures/. Do not edit application source.
          3. Run that spec with npx playwright test (scoped to the new spec).
          On red for that ticket: triage first.
          - If drift (locator/POM test issue) → apply self-heal: Agent-Browser a11y rediscovery, patch pages/ POM only, re-run proving green with assertions unchanged, then open a repair PR linked to this Actions run ($RUN_URL).
          - If real app bug (including axe WCAG on app UI) → bug-reporter only; never heal.
          - Other test issue (e.g. wrong assertion in tests/) → test-writer fix in tests/ or pages/ as appropriate; not self-heal for assertion changes.
          If the same spec fails the same way again on that ticket, stop that ticket and move on (do not loop). Leave the ticket unlabeled when no PR was opened.
          4. When the ticket spec is green, open one pull request linked to the ticket. Put the DS key in the title and body.
          5. After that PR exists, add the tests-generated label so the next run skips it.

          ## CI self-heal (mandatory — no Jira tickets required)
          Run even when Backlog was skipped (zero tickets). After backlog work, or immediately when the queue was empty, run: npx playwright test
          (playwright.config.ts testIgnore excludes tests/manual/** — use the default config, do not pass tests/manual explicitly.)

          If the suite is red: triage each failure.
          - If drift → self-heal: rediscover via Agent-Browser (role + accessible name), patch pages/ POM only, prove green with assertions unchanged, open one repair PR per heal. Link the repair PR body to this Actions run ($RUN_URL) and cite test-results/self-heal/<slug>/ evidence per self-heal skill.
          - If real app bug → bug-reporter; never heal.
          - Env/credentials (e.g. 401 on manual API paths) → report in PR comment or job summary; do not file product bugs.
          Heal budget: at most 5 heals per run. Stop and escalate if a heal cannot prove green without changing assertions.
          EOF
          )"

      - name: Generate eval-report.md
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVAL_CI_RUNS: 15
        run: node scripts/eval-report.mjs --trigger test-generation --run-id ${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: eval-report
          path: eval-report.md
          retention-days: 30
